services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jama-dashboard
    environment:
      PORT: 8000
      NODE_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MONGODB_URI: mongodb://127.0.0.1:27017/jama-dashboard
    volumes:
      - uploads_data:/app/storage/uploads
      - uploads_app:/app/storage/apps
    depends_on:
      - mongodb
    restart: always
    network_mode: "host" ## is important to function the network scanning. The bridge mode puts it behind NAT and the host mode puts it on the same network as the host.

  mongodb:
    image: mongo:7.0 ## MongoDB 5.0+ requires AVX support on x86 hosts.
    container_name: jama-dashboard_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  uploads_app:
    driver: local